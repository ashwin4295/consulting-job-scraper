name: Weekly Consulting Job Scrape

on:
  schedule:
    - cron: '0 18 * * 5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Run scraper
        env:
          OUTPUT_DIR: ${{ github.workspace }}
        run: python scrape_jobs.py

      - name: Upload Excel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: consulting-job-board-${{ github.run_number }}
          path: consulting_job_board_*.xlsx
          retention-days: 30

      - name: Send email with job board
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Weekly Consulting Job Board - ${{ github.run_number }}"
          to: ashwin4295@gmail.com, khushivanshkar95@gmail.com
          from: MBB Prep Bot <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Hi,

            Your weekly consulting job board Excel is attached.

            This was generated automatically on ${{ github.event.repository.updated_at }}.

            - MBB Prep Bot
          attachments: consulting_job_board_*.xlsx
